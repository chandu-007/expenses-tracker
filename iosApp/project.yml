name: Expenses
options:
  bundleIdPrefix: app.expenses
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Expenses:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
    dependencies:
      # Built by ./gradlew :shared:assembleSharedXCFramework -PenableIos=true (tools/ios_build.sh does it). Static, so it is linked, not embedded.
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Expenses
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Compose draws at the screen's full refresh rate on iPhones with ProMotion.
        CADisableMinimumFrameDurationOnPhone: true
        # Reminders: iOS may wake the app now and then to look for what is due (BGAppRefreshTask; the time is the system's choice).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.expenses.tracker.ios.refresh]
        NSFaceIDUsageDescription: Face ID unlocks Expenses when you turn on the app lock. Your face is checked by the iPhone; the app never sees it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.expenses.tracker.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -lz"
  ExpensesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Expenses
      # Only for the module (the types); the code is in the host app's binary, which these tests are loaded into.
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.expenses.tracker.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Expenses.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Expenses"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ExpensesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Expenses
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.expenses.tracker.ios.uitests
        TEST_TARGET_NAME: Expenses
schemes:
  Expenses:
    build:
      targets:
        Expenses: all
    test:
      targets: [ExpensesTests, ExpensesUITests]
