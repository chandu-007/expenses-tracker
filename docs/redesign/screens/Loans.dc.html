<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lent and borrowed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 20px; padding-bottom: 24px; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 0">
    <a href="More.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 17px; font-weight: 600">Lent and borrowed</h1>
  </header>
  <section style="display: flex; flex-direction: column; gap: 4px; padding: 0 20px">
    <span style="font-size: 14px; color: #5C6166">All settled, you get back</span>
    <span style="font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 34px; font-weight: 600; letter-spacing: -0.8px; color: #0E6B5C">{{ net }}</span>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px; margin: 0 16px">
    <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: #5C6166">People</h2>
    <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #E0F2F7; color: #0E6E86; display: flex; align-items: center; justify-content: center; font-weight: 700">R</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Ravi</span><span style="font-size: 12px; color: #5C6166">Lent on 2 Nov</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #0E6B5C">₹2,000</span><span style="font-size: 12px; color: #5C6166">owes you</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px; border-top: 1px solid #EDEDE8">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #FAE3EC; color: #B0185A; display: flex; align-items: center; justify-content: center; font-weight: 700">P</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Priya</span><span style="font-size: 12px; color: #5C6166">Paid for your movie ticket, 14 Nov</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #A34A06">₹850</span><span style="font-size: 12px; color: #5C6166">you owe</span></span>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 44px; border-radius: 14px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #17191B">I gave money</button>
      <button style="flex: 1; height: 44px; border-radius: 14px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #17191B">I got money</button>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px; margin: 0 16px">
    <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: #5C6166">Waiting to get back</h2>
    <sc-if value="{{ waiting }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px">
        <span style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 500">Barbeque Nation split</span><span style="font-size: 15px; font-weight: 600">₹620</span></span>
        <span style="font-size: 13px; color: #5C6166">Half of ₹1,240 from Ravi · counts as spending until it comes back</span>
        <div style="display: flex; gap: 8px">
          <button onClick="{{ drop }}" style="flex: 1; height: 44px; border-radius: 14px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #17191B; cursor: pointer">Not expecting it</button>
          <button onClick="{{ got }}" style="flex: 1; height: 44px; border-radius: 14px; border: 0; background: #0E6B5C; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer">Got it back</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ settled }}" hint-placeholder-val="{{ false }}">
      <span style="padding: 16px; border-radius: 16px; background: #E3F1EC; color: #0B5A4D; font-size: 14px; font-weight: 600">{{ settledText }}</span>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: 'waiting' };
  }
  renderVals() {
    const self = this;
    const st = this.state.status;
    const net = 2000 - 850 + (st === 'waiting' ? 620 : 0);
    return {
      net: '₹' + net.toLocaleString('en-IN'),
      waiting: st === 'waiting',
      settled: st !== 'waiting',
      settledText: st === 'got' ? '₹620 recorded as a refund into Bank. Food for the month is now ₹620 lower.' : 'Done. The full ₹1,240 stays as your spending.',
      got: function () { self.setState({ status: 'got' }); },
      drop: function () { self.setState({ status: 'drop' }); }
    };
  }
}
</script>
</body>
</html>
