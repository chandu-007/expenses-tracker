<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up reading bank texts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 8px 0 20px">
  <header style="display: flex; align-items: center; gap: 4px; padding: 0 8px">
    <a href="CaptureSettings.dc.html" aria-label="Close" style="width: 48px; height: 48px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span style="flex: 1; font-size: 14px; color: #5C6166; font-weight: 600">{{ stepLabel }}</span>
  </header>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 20px">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4"><span style="height: 4px; border-radius: 999px; background: {{ b }}"></span></sc-for>
  </div>

  <section style="display: flex; flex-direction: column; gap: 10px; padding: 8px 20px 0">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.15">{{ title }}</h1>
    <span style="font-size: 15px; color: #5C6166; line-height: 1.5">{{ body }}</span>
  </section>

  <sc-if value="{{ isPermission }}" hint-placeholder-val="{{ true }}">
    <div style="margin: 0 16px; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8E3">
      <span style="display: flex; gap: 10px; font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E6B5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="m5 12 5 5 9-10"></path></svg>Only texts from banks are read, on this phone</span>
      <span style="display: flex; gap: 10px; font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E6B5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="m5 12 5 5 9-10"></path></svg>Texts from people and OTPs are skipped unread</span>
      <span style="display: flex; gap: 10px; font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E6B5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="m5 12 5 5 9-10"></path></svg>Nothing is added until you approve it</span>
      <span style="display: flex; gap: 10px; font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E6B5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="m5 12 5 5 9-10"></path></svg>Old texts on your phone are never looked at</span>
    </div>
  </sc-if>

  <sc-if value="{{ isBanks }}" hint-placeholder-val="{{ false }}">
    <div role="group" aria-label="Banks" style="margin: 0 16px; display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{ bankChips }}" as="c" hint-placeholder-count="8">
        <button onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; font-size: 14px; font-weight: 600; cursor: pointer">{{ c.label }}</button>
      </sc-for>
      <button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px dashed #C9CAC3; background: transparent; color: #5C6166; font-size: 14px; font-weight: 600">My bank isn’t listed</button>
    </div>
  </sc-if>

  <sc-if value="{{ isAccounts }}" hint-placeholder-val="{{ false }}">
    <div style="margin: 0 16px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ matches }}" as="mt" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E8E8E3">
          <span style="font-size: 15px; font-weight: 600">{{ mt.bank }}</span>
          <div style="display: flex; gap: 8px">
            <label style="flex: 1; display: flex; align-items: center; height: 44px; padding: 0 12px; border: 1px solid #E0E0DA; border-radius: 12px; font-size: 14px; color: #5C6166; gap: 6px">··<input value="{{ mt.digits }}" aria-label="{{ mt.digitsLabel }}" inputmode="numeric" style="width: 60px; border: 0; outline: none; font: inherit; color: #17191B; background: transparent"></label>
            <button style="flex: 1.4; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-radius: 12px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #17191B">{{ mt.account }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isCheck }}" hint-placeholder-val="{{ false }}">
    <div style="margin: 0 16px; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; overflow: hidden">
      <sc-for list="{{ checks }}" as="ck" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; border-top: {{ ck.line }}">
          <span style="width: 24px; height: 24px; flex: none; border-radius: 999px; background: #E3F1EC; color: #0E6B5C; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
          <span style="font-size: 15px">{{ ck.label }}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="margin: auto 16px 0; display: flex; flex-direction: column; gap: 4px">
    <button onClick="{{ next }}" style="height: 54px; border: 0; border-radius: 16px; background: #0E6B5C; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">{{ primary }}</button>
    <div style="display: flex; justify-content: space-between">
      <button onClick="{{ back }}" style="height: 48px; padding: 0 8px; border: 0; background: transparent; color: {{ backColor }}; font-size: 15px; font-weight: 600; cursor: pointer">Back</button>
      <button onClick="{{ next }}" style="height: 48px; padding: 0 8px; border: 0; background: transparent; color: #5C6166; font-size: 15px; font-weight: 600; cursor: pointer">Skip this step</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, picked: { 'HDFC Bank': true, 'ICICI Bank': true } };
  }
  renderVals() {
    const self = this;
    const s = this.state;
    const steps = [
      ['Let the app see bank texts as they arrive', 'Each new bank text becomes an entry waiting for your OK. It saves typing almost every expense.', 'Turn on and give access'],
      ['Which banks text you?', 'Pick every bank and card you use. Texts from other senders stay unread.', 'Next'],
      ['Match each bank to an account', 'The last digits in a bank’s text tell the app which of your accounts it is.', 'Save and continue'],
      ['All set', 'Everything was checked just now, on this phone.', 'Done']
    ];
    const banks = ['HDFC Bank', 'ICICI Bank', 'SBI', 'Axis Bank', 'Kotak', 'IDFC FIRST', 'Yes Bank', 'AU Bank'];
    const step = s.step;
    return {
      stepLabel: 'Step ' + (step + 1) + ' of 4',
      bars: [0, 1, 2, 3].map(function (i) { return i <= step ? '#0E6B5C' : '#DCDDD7'; }),
      title: steps[step][0], body: steps[step][1], primary: steps[step][2],
      isPermission: step === 0, isBanks: step === 1, isAccounts: step === 2, isCheck: step === 3,
      bankChips: banks.map(function (b) {
        const on = !!s.picked[b];
        return { label: b, pressed: on ? 'true' : 'false', bg: on ? '#E3F1EC' : '#FFFFFF', border: on ? '#0E6B5C' : '#E0E0DA', fg: on ? '#0B5A4D' : '#17191B', pick: function () { const p = Object.assign({}, s.picked); p[b] = !p[b]; self.setState({ picked: p }); } };
      }),
      matches: [
        { bank: 'HDFC Bank', digits: '4417', digitsLabel: 'HDFC Bank last digits', account: 'Bank' },
        { bank: 'ICICI Bank', digits: '9012', digitsLabel: 'ICICI Bank last digits', account: 'ICICI Amazon Pay' }
      ],
      checks: ['Permission given', '2 banks will be read', 'Both banks matched to an account', 'A test text was found and parsed'].map(function (l, i) { return { label: l, line: i === 0 ? '0' : '1px solid #EDEDE8' }; }),
      next: function () { self.setState({ step: Math.min(3, step + 1) }); },
      back: function () { self.setState({ step: Math.max(0, step - 1) }); },
      backColor: step === 0 ? '#C9CAC3' : '#17191B'
    };
  }
}
</script>
</body>
</html>
