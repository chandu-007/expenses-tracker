<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fill in missing categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 8px 0 20px; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 4px; padding: 0 8px">
    <a href="More.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 17px; font-weight: 600">No category</h1>
    <span style="font-size: 14px; color: #5C6166; font-weight: 600; padding-right: 12px">{{ counter }}</span>
  </header>

  <sc-if value="{{ hasItem }}" hint-placeholder-val="{{ true }}">
    <section style="display: flex; flex-direction: column; gap: 20px">
      <div style="margin: 0 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px 16px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E8E8E3; text-align: center">
        <span style="font-size: 17px; font-weight: 600">{{ item.name }}</span>
        <span style="font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 36px; font-weight: 600; letter-spacing: -0.8px">{{ item.amount }}</span>
        <span style="font-size: 13px; color: #5C6166">{{ item.meta }}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin: 0 16px">
        <span style="font-size: 13px; font-weight: 600; color: #5C6166; margin: 0 4px">Where does it go?</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
            <button onClick="{{ c.pick }}" style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 14px; border: 1.5px solid {{ c.border }}; background: {{ c.bg }}; color: #17191B; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer">
              <span style="width: 10px; height: 10px; border-radius: 3px; background: {{ c.dot }}; flex: none"></span><span style="flex: 1">{{ c.name }}</span><span style="font-size: 11px; font-weight: 600; color: #0B5A4D">{{ c.tag }}</span>
            </button>
          </sc-for>
        </div>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; font-size: 14px">
          <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0E6B5C">{{ item.same }}
        </label>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 64px 32px; text-align: center">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: #E3F1EC; color: #0E6B5C; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
      <span style="font-size: 18px; font-weight: 600">Every expense has a category</span>
      <span style="font-size: 14px; color: #5C6166">Reports and budgets now add up.</span>
    </div>
  </sc-if>

  <div style="margin: auto 16px 0; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 12px; color: #5C6166; max-width: 220px">Skipped ones stay as they are.</span>
    <button onClick="{{ skip }}" style="height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 15px; font-weight: 600; color: #17191B; cursor: pointer">Skip</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const self = this;
    const items = [
      { name: 'Decathlon', amount: '₹2,499', meta: 'Wed 18 Nov · Bank', sug: 'Shopping', same: 'Also file 2 earlier Decathlon expenses' },
      { name: 'Apollo Pharmacy', amount: '₹612', meta: 'Mon 16 Nov · Cash', sug: 'Health', same: 'Also file 1 earlier Apollo Pharmacy expense' },
      { name: 'UPI to 98xxxx2210', amount: '₹1,500', meta: 'Sat 14 Nov · Bank', sug: 'Transfers', same: 'Remember this payee' },
      { name: 'Shell', amount: '₹2,000', meta: 'Thu 12 Nov · ICICI Amazon Pay', sug: 'Transport', same: 'Also file 3 earlier Shell expenses' }
    ];
    const i = this.state.i;
    const next = function () { self.setState({ i: i + 1 }); };
    const item = items[Math.min(i, items.length - 1)];
    const colors = { Shopping: '#B98309', Health: '#C42067', Transport: '#0E8FAD', Food: '#7C4DDB', Bills: '#2F5BD3', Fun: '#E07A1F', Groceries: '#5B8F14', Transfers: '#6B7075' };
    const order = [item.sug].concat(['Food', 'Shopping', 'Bills', 'Transport', 'Health', 'Fun', 'Groceries'].filter(function (n) { return n !== item.sug; })).slice(0, 6);
    return {
      hasItem: i < items.length,
      done: i >= items.length,
      counter: i < items.length ? (i + 1) + ' of ' + items.length : '',
      item: item,
      cats: order.map(function (n, k) {
        return { name: n, dot: colors[n], tag: k === 0 ? 'Suggested' : '', border: k === 0 ? '#0E6B5C' : '#E8E8E3', bg: k === 0 ? '#E3F1EC' : '#FFFFFF', pick: next };
      }),
      skip: next
    };
  }
}
</script>
</body>
</html>
