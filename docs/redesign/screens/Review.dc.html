<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>To review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B5C;text-decoration:none}a:hover{color:#0B5A4D}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 8px 0 20px; font-variant-numeric: tabular-nums">

  <header style="display: flex; align-items: center; gap: 4px; padding: 0 8px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 17px; font-weight: 600">To review</h1>
  </header>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 20px">
    <span style="font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.5px">{{ headline }}</span>
    <span style="font-size: 14px; color: #5C6166">{{ subline }}</span>
  </div>

  <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
        <article style="display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; padding: 16px">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: {{ it.tileBg }}; color: {{ it.tileFg }}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">{{ it.initial }}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 16px; font-weight: 600">{{ it.name }}</span>
              <span style="font-size: 13px; color: #5C6166">{{ it.meta }}</span>
            </span>
            <span style="font-size: 18px; font-weight: 600">{{ it.amount }}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; gap: 8px; flex-wrap: wrap">
              <button style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; border: 1px solid #E0E0DA; background: #F5F5F2; font-size: 13px; font-weight: 600; color: #17191B"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{ it.dot }}"></span>{{ it.cat }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              <button style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; border: 1px solid #E0E0DA; background: #F5F5F2; font-size: 13px; font-weight: 600; color: #17191B">{{ it.acct }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            </div>
            <span style="font-size: 12px; color: #5C6166">{{ it.why }}</span>
          </div>
          <div style="display: flex; gap: 8px">
            <button onClick="{{ it.skip }}" style="flex: 1; height: 44px; border-radius: 14px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 15px; font-weight: 600; color: #17191B">Skip</button>
            <button onClick="{{ it.add }}" style="flex: 2; height: 44px; border-radius: 14px; border: 0; background: #0E6B5C; font-size: 15px; font-weight: 600; color: #FFFFFF">Add</button>
          </div>
        </article>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 32px; text-align: center">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: #E3F1EC; color: #0E6B5C; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
      <span style="font-size: 18px; font-weight: 600">All caught up</span>
      <span style="font-size: 14px; color: #5C6166">New bank texts land here for a quick check.</span>
      <a href="Main.dc.html" style="margin-top: 8px; font-size: 15px; font-weight: 600; padding: 12px 16px">Back to Home</a>
    </div>
  </sc-if>

  <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
      <span style="text-align: center; font-size: 12px; color: #5C6166">Swipe a card right to add, left to skip</span>
      <button onClick="{{ addAll }}" style="height: 54px; border: 0; border-radius: 16px; background: #17191B; color: #FFFFFF; font-size: 16px; font-weight: 600">{{ addAllLabel }}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {} };
  }
  renderVals() {
    const self = this;
    const all = [
      { id: 'z', name: 'Zomato', initial: 'Z', meta: 'Axis Bank ··7710 · 23 Nov', amount: '₹640', value: 640, cat: 'Food', dot: '#7C4DDB', acct: 'Bank', why: 'Matched 14 earlier Zomato entries', tileBg: '#EFE8FB', tileFg: '#6A3FC8' },
      { id: 'a', name: 'Airtel', initial: 'A', meta: 'ICICI Bank ··9012 · 23 Nov', amount: '₹799', value: 799, cat: 'Bills', dot: '#2F5BD3', acct: 'ICICI Amazon Pay', why: 'Matched 6 earlier Airtel entries', tileBg: '#E3EAFB', tileFg: '#2B53C2' }
    ];
    const done = this.state.done;
    const left = all.filter(function (x) { return !done[x.id]; });
    const total = left.reduce(function (s, x) { return s + x.value; }, 0);
    const mark = function (id) { return function () { const d = Object.assign({}, self.state.done); d[id] = true; self.setState({ done: d }); }; };
    const items = left.map(function (x) { return Object.assign({}, x, { add: mark(x.id), skip: mark(x.id) }); });
    const n = left.length;
    return {
      items: items,
      hasItems: n > 0,
      empty: n === 0,
      headline: n === 0 ? 'Nothing waiting' : (n === 1 ? '1 entry to check' : n + ' entries to check'),
      subline: n === 0 ? 'Every bank text so far is in your ledger.' : 'From bank texts · ₹' + total.toLocaleString('en-IN') + ' out',
      addAllLabel: n === 1 ? 'Add it · ₹' + total.toLocaleString('en-IN') : 'Add all ' + n + ' · ₹' + total.toLocaleString('en-IN'),
      addAll: function () { self.setState({ done: { z: true, a: true } }); }
    };
  }
}
</script>
</body>
</html>
