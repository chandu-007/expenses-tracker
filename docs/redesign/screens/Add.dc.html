<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B5C;text-decoration:none}a:hover{color:#0B5A4D}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6B7075}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 8px 0 16px; font-variant-numeric: tabular-nums">

  <header style="display: flex; align-items: center; gap: 4px; padding: 0 8px">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 17px; font-weight: 600">New entry</h1>
  </header>

  <div role="group" aria-label="Entry type" style="display: flex; gap: 2px; margin: 0 16px; background: #EAEAE4; border-radius: 12px; padding: 3px">
    <button onClick="{{ setExpense }}" aria-pressed="{{ typeP.expense }}" style="flex: 1; height: 36px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; background: {{ typeBg.expense }}; color: {{ typeFg.expense }}; box-shadow: {{ typeSh.expense }}">Expense</button>
    <button onClick="{{ setIncome }}" aria-pressed="{{ typeP.income }}" style="flex: 1; height: 36px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; background: {{ typeBg.income }}; color: {{ typeFg.income }}; box-shadow: {{ typeSh.income }}">Income</button>
    <button onClick="{{ setTransfer }}" aria-pressed="{{ typeP.transfer }}" style="flex: 1; height: 36px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; background: {{ typeBg.transfer }}; color: {{ typeFg.transfer }}; box-shadow: {{ typeSh.transfer }}">Transfer</button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px 0">
    <span style="height: 18px; font-size: 14px; color: #5C6166">{{ exprDisplay }}</span>
    <output aria-live="polite" style="font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 50px; font-weight: 600; letter-spacing: -1.2px; line-height: 1.04">{{ amountDisplay }}</output>
  </div>

  <label style="display: flex; align-items: center; gap: 10px; margin: 0 16px; height: 48px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #E0E0DA; border-radius: 14px; color: #5C6166">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">What was it for</span>
    <input type="text" placeholder="What for? Try “chai 20 yesterday”" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #17191B">
  </label>

  <div role="group" aria-label="Category" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 16px">
    <button onClick="{{ pick.food }}" aria-pressed="{{ catP.food }}" style="height: 62px; border-radius: 14px; border: 1.5px solid {{ catBorder.food }}; background: {{ catBg.food }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #17191B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A3FC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2 1-3 3.5-3 7h3"></path></svg>Food</button>
    <button onClick="{{ pick.transport }}" aria-pressed="{{ catP.transport }}" style="height: 62px; border-radius: 14px; border: 1.5px solid {{ catBorder.transport }}; background: {{ catBg.transport }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #17191B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E6E86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"></rect><path d="M4 11h16M8 21v-3M16 21v-3"></path></svg>Transport</button>
    <button onClick="{{ pick.groceries }}" aria-pressed="{{ catP.groceries }}" style="height: 62px; border-radius: 14px; border: 1.5px solid {{ catBorder.groceries }}; background: {{ catBg.groceries }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #17191B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F6A0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.4 12h11.2L21 7H6"></path></svg>Groceries</button>
    <button onClick="{{ pick.bills }}" aria-pressed="{{ catP.bills }}" style="height: 62px; border-radius: 14px; border: 1.5px solid {{ catBorder.bills }}; background: {{ catBg.bills }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #17191B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B53C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Bills</button>
    <button onClick="{{ pick.fun }}" aria-pressed="{{ catP.fun }}" style="height: 62px; border-radius: 14px; border: 1.5px solid {{ catBorder.fun }}; background: {{ catBg.fun }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #17191B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5560A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="m3 7 3-4h4l-3 4M10 7l3-4h4l-3 4"></path></svg>Fun</button>
    <button onClick="{{ pick.shopping }}" aria-pressed="{{ catP.shopping }}" style="height: 62px; border-radius: 14px; border: 1.5px solid {{ catBorder.shopping }}; background: {{ catBg.shopping }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #17191B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A5A06" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Shopping</button>
    <button onClick="{{ pick.health }}" aria-pressed="{{ catP.health }}" style="height: 62px; border-radius: 14px; border: 1.5px solid {{ catBorder.health }}; background: {{ catBg.health }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #17191B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0185A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 6.6a5 5 0 0 0-8.8-2.1 5 5 0 0 0-8.8 2.1C2.4 11 12 20 12 20s9.6-9 8.8-13.4z"></path></svg>Health</button>
    <button style="height: 62px; border-radius: 14px; border: 1.5px dashed #C9CAC3; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #5C6166">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>All 23</button>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 8px; margin: 0 16px">
    <button onClick="{{ nextAcct }}" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #17191B; white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C6166" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>{{ acctName }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    <button style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #17191B">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C6166" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Today</button>
    <button onClick="{{ toggleTrip }}" aria-pressed="{{ tripP }}" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; border: 1px solid {{ tripBorder }}; background: {{ tripBg }}; font-size: 13px; font-weight: 600; color: {{ tripFg }}; white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ tripIcon }}"></path></svg>Goa trip</button>
    <button aria-label="More details: tags, split, receipt, other currency, expect it back" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; border: 1px dashed #C9CAC3; background: transparent; font-size: 13px; font-weight: 600; color: #5C6166">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Details</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: auto 16px 0">
    <sc-for list="{{ keys }}" as="k" hint-placeholder-count="16">
      <button onClick="{{ k.press }}" aria-label="{{ k.aria }}" style="height: 50px; border: 0; border-radius: 14px; background: {{ k.bg }}; color: {{ k.fg }}; font-size: 22px; font-weight: 500">{{ k.label }}</button>
    </sc-for>
  </div>

  <button style="margin: 0 16px; height: 54px; border: 0; border-radius: 16px; background: {{ saveBg }}; color: {{ saveFg }}; font-size: 16px; font-weight: 600">{{ saveLabel }}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { expr: '450+120', cat: 'food', acct: 0, type: 'expense', trip: true };
  }
  evalExpr(expr) {
    const parts = expr.split(/([+−×])/).filter(function (s) { return s !== ''; });
    if (parts.length && /[+−×]/.test(parts[parts.length - 1])) parts.pop();
    if (!parts.length) return 0;
    const nums = [];
    const ops = [];
    parts.forEach(function (p) {
      if (p === '+' || p === '−' || p === '×') ops.push(p);
      else nums.push(parseFloat(p) || 0);
    });
    const n2 = [nums[0]];
    const o2 = [];
    for (let i = 0; i < ops.length; i++) {
      if (ops[i] === '×') n2[n2.length - 1] = n2[n2.length - 1] * (nums[i + 1] || 0);
      else { o2.push(ops[i]); n2.push(nums[i + 1] || 0); }
    }
    let total = n2[0];
    for (let j = 0; j < o2.length; j++) total = o2[j] === '+' ? total + n2[j + 1] : total - n2[j + 1];
    return Math.max(0, Math.round(total * 100) / 100);
  }
  press(k) {
    let e = this.state.expr;
    const isOp = k === '+' || k === '−' || k === '×';
    if (k === 'del') e = e.slice(0, -1);
    else if (isOp) {
      if (!e) return;
      if (/[+−×]$/.test(e)) e = e.slice(0, -1);
      e = e + k;
    } else if (k === '.') {
      const cur = e.split(/[+−×]/).pop();
      if (cur.indexOf('.') >= 0) return;
      e = e + (cur === '' ? '0.' : '.');
    } else {
      if (e.length >= 18) return;
      e = e + k;
    }
    this.setState({ expr: e });
  }
  renderVals() {
    const s = this.state;
    const self = this;
    const total = this.evalExpr(s.expr);
    const fmt = function (n) { return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 }); };
    const hasOp = /[+−×]/.test(s.expr);
    const cats = { food: 'Food', transport: 'Transport', groceries: 'Groceries', bills: 'Bills', fun: 'Fun', shopping: 'Shopping', health: 'Health' };
    const pick = {}, catP = {}, catBorder = {}, catBg = {};
    Object.keys(cats).forEach(function (c) {
      const on = s.cat === c;
      pick[c] = function () { self.setState({ cat: c }); };
      catP[c] = on ? 'true' : 'false';
      catBorder[c] = on ? '#0E6B5C' : '#E8E8E3';
      catBg[c] = on ? '#E3F1EC' : '#FFFFFF';
    });
    const types = ['expense', 'income', 'transfer'];
    const typeP = {}, typeBg = {}, typeFg = {}, typeSh = {};
    types.forEach(function (t) {
      const on = s.type === t;
      typeP[t] = on ? 'true' : 'false';
      typeBg[t] = on ? '#FFFFFF' : 'transparent';
      typeFg[t] = on ? '#17191B' : '#5C6166';
      typeSh[t] = on ? '0 1px 3px rgba(23,25,27,0.12)' : 'none';
    });
    const accts = ['Bank', 'Cash', 'ICICI Amazon Pay'];
    const layout = ['7', '8', '9', 'del', '4', '5', '6', '+', '1', '2', '3', '−', '00', '0', '.', '×'];
    const keys = layout.map(function (k) {
      const op = k === '+' || k === '−' || k === '×' || k === 'del';
      return {
        label: k === 'del' ? '⌫' : k,
        aria: k === 'del' ? 'Delete' : (k === '−' ? 'minus' : (k === '×' ? 'times' : (k === '+' ? 'plus' : k))),
        bg: op ? '#E3F1EC' : '#FFFFFF',
        fg: op ? '#0B5A4D' : '#17191B',
        press: function () { self.press(k); }
      };
    });
    const verb = s.type === 'income' ? 'Add income' : (s.type === 'transfer' ? 'Move' : 'Add');
    return {
      exprDisplay: hasOp ? s.expr.replace(/([+−×])/g, ' $1 ') : '',
      amountDisplay: fmt(total),
      pick: pick, catP: catP, catBorder: catBorder, catBg: catBg,
      typeP: typeP, typeBg: typeBg, typeFg: typeFg, typeSh: typeSh,
      setExpense: function () { self.setState({ type: 'expense' }); },
      setIncome: function () { self.setState({ type: 'income' }); },
      setTransfer: function () { self.setState({ type: 'transfer' }); },
      acctName: accts[s.acct],
      nextAcct: function () { self.setState({ acct: (s.acct + 1) % accts.length }); },
      tripP: s.trip ? 'true' : 'false',
      tripBg: s.trip ? '#FBEBDC' : '#FFFFFF',
      tripFg: s.trip ? '#A34A06' : '#5C6166',
      tripBorder: s.trip ? '#F1C9A2' : '#E0E0DA',
      tripIcon: s.trip ? 'm5 12 5 5 9-10' : 'M12 5v14M5 12h14',
      toggleTrip: function () { self.setState({ trip: !s.trip }); },
      keys: keys,
      saveBg: total > 0 ? '#0E6B5C' : '#DCDDD7',
      saveFg: total > 0 ? '#FFFFFF' : '#5C6166',
      saveLabel: total > 0 ? verb + ' ' + fmt(total) + ' · ' + cats[s.cat] : 'Enter an amount'
    };
  }
}
</script>
</body>
</html>
