<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why isn't capture working?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 20px; padding-bottom: 24px">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 0">
    <a href="CaptureSettings.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600">Capture check-up</h1>
  </header>
  <section style="display: flex; flex-direction: column; gap: 6px; padding: 0 20px">
    <span style="font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.4px">2 things to fix</span>
    <span style="font-size: 14px; color: #5C6166">Checked just now, on this phone. Nothing was sent anywhere.</span>
  </section>

  <section style="margin: 0 16px; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; overflow: hidden">
    <sc-for list="{{ checks }}" as="c" hint-placeholder-count="5">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-top: {{ c.line }}">
        <span style="width: 24px; height: 24px; flex: none; border-radius: 999px; background: {{ c.bg }}; color: {{ c.fg }}; display: flex; align-items: center; justify-content: center; margin-top: 1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.icon }}"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; font-weight: 500">{{ c.title }}</span>
          <span style="font-size: 13px; color: #5C6166; line-height: 1.4">{{ c.sub }}</span>
          <sc-if value="{{ c.hasFix }}" hint-placeholder-val="{{ false }}"><button style="align-self: flex-start; margin-top: 4px; height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: #17191B; color: #FFFFFF; font-size: 13px; font-weight: 600">{{ c.fix }}</button></sc-if>
        </span>
      </div>
    </sc-for>
  </section>

  <section style="margin: 0 16px; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8E8E3">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600">Test a text that was missed</h2>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5C6166">Paste the bank’s text
      <textarea rows="3" style="border: 1px solid #E0E0DA; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; color: #17191B; resize: none">Rs.640 debited from A/c XX7710 on 23-11-26 to ZOMATO. Avl Bal Rs.18,204</textarea>
    </label>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid #E0E0DA; background: #FFFFFF; font-size: 15px; font-weight: 600; color: #17191B">Paste</button>
      <button style="flex: 1; height: 48px; border-radius: 14px; border: 0; background: #0E6B5C; font-size: 15px; font-weight: 600; color: #FFFFFF">Check</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: #E3F1EC">
      <span style="font-size: 14px; font-weight: 600; color: #0B5A4D">Read correctly: ₹640 out, Zomato</span>
      <span style="font-size: 13px; color: #3E5A53">But Axis ··7710 has no account yet, so it waits in To review.</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = 'm5 12 5 5 9-10';
    const warn = 'M12 7v6M12 17h.01';
    const rows = [
      ['ok', 'Permission to receive texts', 'Given', ''],
      ['ok', 'Capture is on', 'Bank texts are read as they arrive', ''],
      ['warn', 'Battery saver may stop it', 'Android can pause the app in the background, so texts arrive late or not at all.', 'Allow in background'],
      ['ok', 'Last bank text seen', 'Today, 10:13 pm, from HDFC Bank', ''],
      ['warn', 'Axis Bank ··7710 has no account', 'Its texts can’t be filed until you choose one.', 'Choose account']
    ];
    return {
      checks: rows.map(function (r, i) {
        const good = r[0] === 'ok';
        return { title: r[1], sub: r[2], fix: r[3], hasFix: !!r[3], icon: good ? ok : warn, bg: good ? '#E3F1EC' : '#FBEBD9', fg: good ? '#0E6B5C' : '#A34A06', line: i === 0 ? '0' : '1px solid #EDEDE8' };
      })
    };
  }
}
</script>
</body>
</html>
