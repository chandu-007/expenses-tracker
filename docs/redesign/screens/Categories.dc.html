<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 0">
    <a href="More.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 17px; font-weight: 600">Categories</h1>
    <button aria-label="New category" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: transparent; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>

  <div role="group" aria-label="Kind" style="display: flex; gap: 2px; margin: 0 16px; background: #EAEAE4; border-radius: 12px; padding: 3px">
    <button onClick="{{ setExp }}" aria-pressed="{{ expP }}" style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: {{ expBg }}; box-shadow: {{ expSh }}; font-size: 14px; font-weight: 600; color: {{ expFg }}; cursor: pointer">Expenses · 23</button>
    <button onClick="{{ setInc }}" aria-pressed="{{ incP }}" style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: {{ incBg }}; box-shadow: {{ incSh }}; font-size: 14px; font-weight: 600; color: {{ incFg }}; cursor: pointer">Income · 4</button>
  </div>

  <section style="margin: 0 16px; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; overflow: hidden">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
      <button style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border: 0; border-top: {{ r.line }}; background: transparent; text-align: left; color: #17191B; cursor: pointer">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: {{ r.bg }}; color: {{ r.fg }}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.icon }}"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 500">{{ r.name }}</span><span style="font-size: 12px; color: #5C6166; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.sub }}</span></span>
        <span style="font-size: 14px; font-weight: 600">{{ r.amount }}</span>
      </button>
    </sc-for>
  </section>

  <a href="#" style="margin: 0 16px; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 16px; background: #EDEDE8; color: #17191B; text-decoration: none; font-size: 14px"><span>Ideas: Rent, EMI, School fees, Pets…</span><span style="font-weight: 600; color: #0E6B5C">Browse</span></a>
  <span style="padding: 0 20px; font-size: 12px; color: #5C6166; line-height: 1.45">Tap a category to rename it, change its icon and colour, nest it inside another, or merge it into one you keep.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'exp' };
  }
  renderVals() {
    const self = this;
    const k = this.state.kind;
    const ic = {
      bills: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      fun: 'M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM3 7l3-4h4l-3 4M10 7l3-4h4l-3 4',
      food: 'M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2 1-3 3.5-3 7h3',
      transport: 'M7 3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM4 11h16M8 21v-3M16 21v-3',
      groceries: 'M9 18.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM18 18.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM2 3h3l2.4 12h11.2L21 7H6',
      health: 'M20.8 6.6a5 5 0 0 0-8.8-2.1 5 5 0 0 0-8.8 2.1C2.4 11 12 20 12 20s9.6-9 8.8-13.4z',
      shopping: 'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2',
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      salary: 'M4 6h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM12 10a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z',
      gift: 'M4 11h16v10H4zM2 7h20v4H2zM12 7v14M12 7S10 3 7.5 3a2 2 0 0 0 0 4M12 7s2-4 4.5-4a2 2 0 0 1 0 4',
      interest: 'M5 19 19 5M7 7h.01M17 17h.01',
      refund: 'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5'
    };
    const exp = [
      ['Bills', 'Electricity, internet, phone · 3 inside', '₹24,558', 'bills', '#E3EAFB', '#2B53C2'],
      ['Fun', 'Movies, streaming, outings', '₹9,649', 'fun', '#FBEBDC', '#B5560A'],
      ['Food', 'Eating out, delivery, chai', '₹6,715', 'food', '#EFE8FB', '#6A3FC8'],
      ['Transport', 'Fuel, cabs, autos, metro', '₹3,034', 'transport', '#E0F2F7', '#0E6E86'],
      ['Groceries', 'Kirana, BigBasket, fruit', '₹2,690', 'groceries', '#E9F2DD', '#3F6A0C'],
      ['Health', 'Medicines, doctor, gym', '₹1,499', 'health', '#FAE3EC', '#B0185A'],
      ['Shopping', 'Clothes, gadgets, Amazon', '₹1,160', 'shopping', '#F6EED8', '#8A5A06'],
      ['Home', 'Rent, repairs, help · 2 inside', '₹0', 'home', '#EDEDE8', '#3B3F43']
    ];
    const inc = [
      ['Salary', 'Monthly pay', '₹82,000', 'salary', '#E3F1EC', '#0B5A4D'],
      ['Gifts', 'From family and friends', '₹0', 'gift', '#FAE3EC', '#B0185A'],
      ['Interest', 'Savings and deposits', '₹0', 'interest', '#E3EAFB', '#2B53C2'],
      ['Refunds', 'Money back from shops', '₹1,299', 'refund', '#F6EED8', '#8A5A06']
    ];
    const list = k === 'exp' ? exp : inc;
    const seg = function (on) { return { bg: on ? '#FFFFFF' : 'transparent', sh: on ? '0 1px 3px rgba(23,25,27,0.12)' : 'none', fg: on ? '#17191B' : '#5C6166', p: on ? 'true' : 'false' }; };
    const e = seg(k === 'exp');
    const n = seg(k === 'inc');
    return {
      rows: list.map(function (r, i) { return { name: r[0], sub: r[1] + ' · this month', amount: r[2], icon: ic[r[3]], bg: r[4], fg: r[5], line: i === 0 ? '0' : '1px solid #EDEDE8' }; }),
      setExp: function () { self.setState({ kind: 'exp' }); },
      setInc: function () { self.setState({ kind: 'inc' }); },
      expBg: e.bg, expSh: e.sh, expFg: e.fg, expP: e.p,
      incBg: n.bg, incSh: n.sh, incFg: n.fg, incP: n.p
    };
  }
}
</script>
</body>
</html>
