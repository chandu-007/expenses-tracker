<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>More</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 2440px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 24px 20px 12px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.4px">More</h1>
  </header>

  <main style="display: flex; flex-direction: column; gap: 20px; padding: 0 16px 24px">
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #E0E0DA; border-radius: 14px; color: #5C6166">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" aria-label="Search settings and tools" placeholder="Search settings and tools" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #17191B">
    </label>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="Review.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: #E3F1EC; color: #17191B; text-decoration: none">
        <span style="font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 26px; font-weight: 600; color: #0B5A4D">2</span>
        <span style="font-size: 14px; font-weight: 600">To review</span>
        <span style="font-size: 12px; color: #3E5A53">bank texts waiting</span>
      </a>
      <a href="Categorise.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: #FBEBD9; color: #17191B; text-decoration: none">
        <span style="font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 26px; font-weight: 600; color: #A34A06">4</span>
        <span style="font-size: 14px; font-weight: 600">No category</span>
        <span style="font-size: 12px; color: #6B4A2C">expenses to file</span>
      </a>
    </div>

    <a href="Data.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E8E3; color: #17191B; text-decoration: none">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Last backup: 12 days ago</span><span style="font-size: 12px; color: #5C6166">Your entries live only on this phone</span></span>
      <span style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #17191B; color: #FFFFFF; font-size: 13px; font-weight: 600">Back up</span>
    </a>

    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="6">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: #5C6166">{{ sec.heading }}</h2>
        <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; overflow: hidden">
          <sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="4">
            <a href="{{ r.href }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px 6px 14px; color: #17191B; text-decoration: none; border-top: {{ r.line }}">
              <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #F0F0EB; color: #3B3F43; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.icon }}"></path></svg></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; font-weight: 500">{{ r.title }}</span><span style="font-size: 12px; color: #5C6166; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.sub }}</span></span>
              <sc-if value="{{ r.isSwitch }}" hint-placeholder-val="{{ false }}"><span role="switch" aria-checked="false" style="width: 44px; height: 26px; border-radius: 999px; background: #D5D6D0; position: relative; flex: none"><span style="position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF"></span></span></sc-if>
              <sc-if value="{{ r.isLink }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7075" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></sc-if>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <span style="text-align: center; font-size: 12px; color: #5C6166; padding: 8px 0">Your data stays on this phone · Version 0.16.1</span>
  </main>

  <nav aria-label="Main" style="margin-top: auto; display: flex; align-items: flex-end; justify-content: space-around; background: #FFFFFF; border-top: 1px solid #E8E8E3; padding: 8px 8px 24px">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5C6166; font-size: 12px; font-weight: 500; text-decoration: none">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home</a>
    <a href="Activity.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5C6166; font-size: 12px; font-weight: 500; text-decoration: none">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg></span>Activity</a>
    <a href="Add.dc.html" aria-label="Add expense" style="flex: 1; display: flex; flex-direction: column; align-items: center; text-decoration: none">
      <span style="width: 52px; height: 52px; border-radius: 18px; background: #0E6B5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></a>
    <a href="Reports.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5C6166; font-size: 12px; font-weight: 500; text-decoration: none">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"></path><path d="M6 16v-5M11 16V6M16 16v-8M21 16v-3"></path></svg></span>Reports</a>
    <a href="More.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #0B5A4D; font-size: 12px; font-weight: 600; text-decoration: none">
      <span style="width: 56px; height: 32px; border-radius: 999px; background: #E3F1EC; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></span>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2440}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {

      info: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5h.01',
      mail: 'M4 5h16v11H8l-4 4zM8 9h8M8 12h5'
    };
    const r = function (title, sub, icon, href, sw) { return { title: title, sub: sub, icon: I[icon], href: href || '#', isSwitch: !!sw, isLink: !sw }; };
    const raw = [
      ['Plan and track', [
        r('Budget', '₹25,695 left of ₹75,000', 'budget', 'Budget.dc.html'),
        r('Bills', '3 due this week', 'bills', 'Bills.dc.html'),

        r('Calendar', 'Spending day by day', 'cal', 'Calendar.dc.html'),
        r('Lent and borrowed', 'Who owes whom · 1 waiting', 'people', 'Loans.dc.html')
      ]],
      ['Your ledger', [
        r('Accounts', '3 accounts · net ₹1,80,931', 'bank', 'Accounts.dc.html'),

      ['Make it yours', [

        r('Customise home', 'Choose and reorder the blocks', 'layout', 'HomeLayout.dc.html'),
        r('Currency', 'INR · ₹', 'rupee', '#')
      ]],
      ['Privacy and data', [
        r('Hide amounts', 'Replace every figure with dots', 'eyeoff', '#', true),
        r('App lock', 'Fingerprint, face or phone PIN', 'lock', 'Locked.dc.html'),

        r('Your data', 'Backup, restore, Excel and CSV', 'backup', 'Data.dc.html')
      ]],
      ['Help', [
        r('How to use this app', 'A two-minute tour of the real screens', 'info', '#'),
        r('Send feedback', 'Opens your mail app with the details filled in', 'mail', '#')
      ]]
    ];
    const sections = raw.map(function (s) {
      return { heading: s[0], rows: s[1].map(function (row, i) { return Object.assign({}, row, { line: i === 0 ? '0' : '1px solid #EDEDE8' }); }) };
    });
    return { sections: sections };
  }
}
</script>
</body>
</html>
