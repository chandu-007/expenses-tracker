<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subscriptions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 20px; padding-bottom: 24px; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 0">
    <a href="More.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600">Subscriptions</h1>
  </header>
  <section style="display: flex; flex-direction: column; gap: 4px; padding: 0 20px">
    <span style="font-size: 14px; color: #5C6166">6 found in your entries cost</span>
    <span style="font-family: 'Space Grotesk', Inter, system-ui, sans-serif; font-size: 34px; font-weight: 600; letter-spacing: -0.8px">₹17,651 <span style="font-size: 16px; letter-spacing: 0; color: #5C6166; font-weight: 500">a year</span></span>
    <span style="font-size: 13px; color: #5C6166">About ₹1,471 a month</span>
  </section>
  <section style="margin: 0 16px; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; overflow: hidden">
    <sc-for list="{{ subs }}" as="s" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 8px 8px 16px; border-top: {{ s.line }}">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 500">{{ s.name }}</span><span style="font-size: 12px; color: #5C6166">{{ s.sub }}</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{ s.year }}</span><span style="font-size: 12px; color: #5C6166">a year</span></span>
        <button onClick="{{ s.toggle }}" aria-label="{{ s.bellLabel }}" aria-pressed="{{ s.pressed }}" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: {{ s.bellBg }}; color: {{ s.bellFg }}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></button>
      </div>
    </sc-for>
  </section>
  <span style="padding: 0 20px; font-size: 12px; color: #5C6166; line-height: 1.45">Found when the same shop charges about the same amount again and again. The bell reminds you a day before the next charge, so you can cancel in time.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { n: true } };
  }
  renderVals() {
    const self = this;
    const on = this.state.on;
    const rows = [
      ['n', 'Netflix', '₹649 monthly · next 22 Dec', '₹7,788'],
      ['s', 'Spotify', '₹119 monthly · next 3 Dec', '₹1,428'],
      ['y', 'YouTube Premium', '₹149 monthly · next 9 Dec', '₹1,788'],
      ['g', 'Google One', '₹130 monthly · next 14 Dec', '₹1,560'],
      ['h', 'Hotstar', '₹299 monthly · next 18 Dec', '₹3,588'],
      ['p', 'Amazon Prime', '₹1,499 yearly · next July', '₹1,499']
    ];
    return {
      subs: rows.map(function (r, i) {
        const o = !!on[r[0]];
        return { name: r[1], sub: o ? r[2] + ' · reminder set' : r[2], year: r[3], line: i === 0 ? '0' : '1px solid #EDEDE8', bellBg: o ? '#E3F1EC' : 'transparent', bellFg: o ? '#0B5A4D' : '#6B7075', pressed: o ? 'true' : 'false', bellLabel: 'Remind me before ' + r[1] + ' charges', toggle: function () { const n = Object.assign({}, on); n[r[0]] = !n[r[0]]; self.setState({ on: n }); } };
      })
    };
  }
}
</script>
</body>
</html>
