<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture from texts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #F5F5F2; color: #17191B; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 20px; padding-bottom: 24px">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 0">
    <a href="More.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; color: #17191B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600">Capture from texts</h1>
  </header>

  <section style="margin: 0 16px; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E8E8E3">
    <button role="switch" aria-checked="{{ onChecked }}" onClick="{{ toggle }}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; border: 0; background: transparent; padding: 0; text-align: left; color: #17191B; cursor: pointer">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">Read bank texts</span><span style="font-size: 13px; color: {{ statusColor }}; font-weight: 600">{{ status }}</span></span>
      <span style="width: 44px; height: 26px; flex: none; border-radius: 999px; background: {{ track }}; position: relative"><span style="position: absolute; top: 3px; left: {{ knob }}; width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF"></span></span>
    </button>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <span style="display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 12px; background: #F5F5F2"><span style="font-size: 17px; font-weight: 600">38</span><span style="font-size: 12px; color: #5C6166">found in Nov</span></span>
      <span style="display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 12px; background: #F5F5F2"><span style="font-size: 17px; font-weight: 600">2</span><span style="font-size: 12px; color: #5C6166">to review</span></span>
      <span style="display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 12px; background: #F5F5F2"><span style="font-size: 17px; font-weight: 600">3</span><span style="font-size: 12px; color: #5C6166">senders skipped</span></span>
    </div>
    <span style="font-size: 13px; color: #5C6166; line-height: 1.45">Nothing is added on its own: every text waits in To review until you say yes. Texts from people and OTPs are skipped unread.</span>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px; margin: 0 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; margin: 0 4px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: #5C6166">Your banks</h2>
      <button style="height: 40px; border: 0; background: transparent; color: #0E6B5C; font-size: 14px; font-weight: 600">Add a bank</button>
    </div>
    <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; overflow: hidden">
      <sc-for list="{{ banks }}" as="b" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-top: {{ b.line }}">
          <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #E3EAFB; color: #2B53C2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{ b.short }}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{ b.name }}</span><span style="font-size: 12px; color: #5C6166">{{ b.sub }}</span></span>
          <span style="font-size: 12px; font-weight: 600; color: {{ b.stateColor }}">{{ b.state }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E8E8E3; border-radius: 20px; overflow: hidden; margin: 0 16px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
      <a href="{{ l.href }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px 6px 16px; color: #17191B; text-decoration: none; border-top: {{ l.line }}">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{ l.title }}</span><span style="font-size: 12px; color: #5C6166">{{ l.sub }}</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7075" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  renderVals() {
    const self = this;
    const on = this.state.on;
    const line = function (arr) { return arr.map(function (x, i) { return Object.assign(x, { line: i === 0 ? '0' : '1px solid #EDEDE8' }); }); };
    return {
      onChecked: on ? 'true' : 'false',
      track: on ? '#0E6B5C' : '#D5D6D0',
      knob: on ? '21px' : '3px',
      status: on ? 'On · last bank text today, 10:13 pm' : 'Off · nothing is read',
      statusColor: on ? '#0E6B5C' : '#5C6166',
      toggle: function () { self.setState({ on: !on }); },
      banks: line([
        { short: 'HD', name: 'HDFC Bank', sub: 'Account ··4417 → Bank', state: 'Seen today', stateColor: '#0E6B5C' },
        { short: 'IC', name: 'ICICI Bank', sub: 'Card ··9012 → ICICI Amazon Pay', state: 'Seen today', stateColor: '#0E6B5C' },
        { short: 'AX', name: 'Axis Bank', sub: 'Account ··7710 → not linked yet', state: 'Choose account', stateColor: '#A34A06' }
      ]),
      links: line([
        { title: 'Senders we skipped', sub: '3 names · one may be your bank', href: '#' },
        { title: 'What the app has learned', sub: '41 shops filed under a category', href: '#' },
        { title: 'Why isn’t capture working?', sub: 'Checks every step on this phone', href: 'Checkup.dc.html' },
        { title: 'Set up again, step by step', sub: 'Permission, banks, accounts, a test', href: 'Setup.dc.html' }
      ])
    };
  }
}
</script>
</body>
</html>
